<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    h1 {
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .speed-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .speed-btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    
    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .speed-btn.active {
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
    }
    
    .custom-speed {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .custom-speed input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
    }
    
    .custom-speed input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    
    .current-speed {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    
    .shortcuts {
      font-size: 12px;
      opacity: 0.8;
      text-align: center;
      line-height: 1.4;
    }
    
    .error {
      color: #ff6b6b;
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Video Speed Controller</h1>
    
    <div class="current-speed" id="currentSpeed">
      Speed: 1.0x
    </div>
    
    <div class="speed-controls">
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.75">0.75x</button>
      <button class="speed-btn active" data-speed="1">1.0x</button>
      <button class="speed-btn" data-speed="1.25">1.25x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.75">1.75x</button>
      <button class="speed-btn" data-speed="2">2.0x</button>
      <button class="speed-btn" data-speed="2.5">2.5x</button>
      <button class="speed-btn" data-speed="3">3.0x</button>
    </div>
    
    <div class="custom-speed">
      <input type="number" id="customSpeed" placeholder="カスタム速度" min="0.1" max="10" step="0.1">
      <button class="speed-btn" id="applyCustom">適用</button>
    </div>
    
    <div class="shortcuts">
      ⌨️ ショートカット<br>
      S : 速度を下げる<br>
      D : 速度を上げる<br>
      \ : 通常速度に戻す
    </div>
    
    <div class="error" id="errorMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
